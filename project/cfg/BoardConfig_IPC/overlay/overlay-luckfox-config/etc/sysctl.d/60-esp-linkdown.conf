# Dual-homed same-subnet fix: eth0 (e.g. static .13) and wlan0 (dhcp) both on the
# same /24 -> two connected routes. On eth0 cable-unplug the iface stays UP
# (carrier=0) so its route persists and the kernel blackholes wlan0 replies out the
# dead eth0. Flagging linkdown routes as ignored makes lookups skip them -> wlan0
# takes over. default= propagates to wlan0 (created at S44, after S02sysctl).
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv4.conf.eth0.ignore_routes_with_linkdown = 1
