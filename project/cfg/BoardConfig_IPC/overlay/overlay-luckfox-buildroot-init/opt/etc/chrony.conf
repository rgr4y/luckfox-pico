# chrony NTP client — Apple + Cloudflare preferred (primary), local gw + pool as extra
server time.apple.com iburst prefer
server time.cloudflare.com iburst prefer
server 10.0.1.1 iburst
pool pool.ntp.org iburst

driftfile /opt/var/lib/chrony/drift
makestep 1.0 3
rtcsync
pidfile /var/run/chronyd.pid
