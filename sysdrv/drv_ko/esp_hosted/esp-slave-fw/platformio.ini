; ESP-Hosted-NG slave firmware — ESP32-C5 (SDIO transport), for the Luckfox trio.
;
; NOTE: this is an IDF-NATIVE project (uses main/, custom CMakeLists, per-target
; sdkconfig.defaults). The tested/reproducible build is Docker idf.py -> ./build.sh
; (or a local ESP-IDF >= v5.5). This platformio.ini is provided per request; C5 is
; ONLY supported by the pioarduino fork (the official espressif32 platform errors
; on C5 with a missing platformio-build.py). PlatformIO's espidf builder also
; expects sources under src/, while ESP-Hosted uses main/ — so `pio run` may need
; the project pointed at network_adapter/main as its main component. If pio fights
; it, use ./build.sh. Kept here so `pio` users have a starting point.
[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
board = esp32-c5-devkitc-1
monitor_speed = 115200
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c5"
board_build.partitions = network_adapter/partitions.esp32c5.csv
