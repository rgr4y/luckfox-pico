services:
  luckfox-build:
    build:
      context: .
      dockerfile: Dockerfile.build
    volumes:
      # Host SDK path. Defaults to the repo root (compose file dir) so it works
      # anywhere; override for out-of-tree checkouts, e.g. on the Unraid box:
      #   LUCKFOX_SDK_DIR=/mnt/user/appdata/kvm/luckfox-pico docker compose ...
      - ${LUCKFOX_SDK_DIR:-.}:/sdk
    working_dir: /sdk
    command: >
      bash -c "
        echo '=== Selecting KVM board config ===' &&
        ln -rfs /sdk/project/cfg/BoardConfig_IPC/BoardConfig-EMMC-Buildroot-RV1106_Luckfox_Pico_KVM-IPC.mk /sdk/.BoardConfig.mk &&
        ls -la /sdk/.BoardConfig.mk &&
        echo '=== Building all ===' &&
        ./build.sh allsave 2>&1 | tee /sdk/build.log ;
        echo \"=== Exit code: \$$? ===\" ;
        ls -lh /sdk/output/image/ 2>/dev/null
      "
    tty: true
